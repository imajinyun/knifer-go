# This workflow will build a golang project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-go

name: knifer-go-ci

env:
  GOTOOLCHAIN: local
  GOWORK: "off"
  AGENT_CHANGE_BASE_REF: ${{ github.event.pull_request.base.sha || github.event.before }}
  GOLANGCI_LINT_VERSION: v2.14.0
  GO_RELEASE_VERSION: "1.27.1"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  agent-governance:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: true

      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"

      - name: Build result recorder
        run: go build -o .aiflow/ci/ciresult ./bin/ciresult

      - name: Run governance gates
        run: .aiflow/ci/ciresult run -id agent-governance -out .aiflow/ci/records -- make ci-governance-check

      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_attempt }}-agent-governance
          path: .aiflow/ci/records/agent-governance.json
          include-hidden-files: true
          if-no-files-found: error

  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        go-version: ["1.26.8", "1.27.1"]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ matrix.go-version }}"

      - name: Build result recorder
        run: go build -o .aiflow/ci/ciresult ./bin/ciresult

      - name: Run CI test gates
        run: .aiflow/ci/ciresult run -id test-${{ matrix.go-version }} -out .aiflow/ci/records -- make ci-test COVERAGE_FILE=.aiflow/ci/coverage.out

      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_attempt }}-test-${{ matrix.go-version }}
          path: .aiflow/ci/records/test-${{ matrix.go-version }}.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ github.run_attempt }}-${{ matrix.go-version }}
          path: |
            .aiflow/ci/coverage.out
            .aiflow/ci/coverage.out.meta.json
          include-hidden-files: true

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: .aiflow/ci/coverage.out
          flags: unittests
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Build result recorder
        run: go build -o .aiflow/ci/ciresult ./bin/ciresult

      - name: Run lint gate
        run: .aiflow/ci/ciresult run -id lint -out .aiflow/ci/records -- make lint

      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_attempt }}-lint
          path: .aiflow/ci/records/lint.json
          include-hidden-files: true
          if-no-files-found: error

  govulncheck:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: true

      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"

      - name: Build result recorder
        run: go build -o .aiflow/ci/ciresult ./bin/ciresult

      - name: Run vulnerability gate
        run: .aiflow/ci/ciresult run -id govulncheck -out .aiflow/ci/records -- make govulncheck

      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_attempt }}-govulncheck
          path: .aiflow/ci/records/govulncheck.json
          include-hidden-files: true
          if-no-files-found: error

  benchmark-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: true

      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"

      - name: Build result recorder
        run: go build -o .aiflow/ci/ciresult ./bin/ciresult

      - name: Run benchmark smoke gate
        run: .aiflow/ci/ciresult run -id benchmark-smoke -out .aiflow/ci/records -- make bench-smoke

      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_attempt }}-benchmark-smoke
          path: .aiflow/ci/records/benchmark-smoke.json
          include-hidden-files: true
          if-no-files-found: error

  fuzz-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: true

      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"

      - name: Build result recorder
        run: go build -o .aiflow/ci/ciresult ./bin/ciresult

      - name: Run all fuzz smoke targets
        run: .aiflow/ci/ciresult run -id fuzz-smoke -out .aiflow/ci/records -- make fuzz-smoke

      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_attempt }}-fuzz-smoke
          path: .aiflow/ci/records/fuzz-smoke.json
          include-hidden-files: true
          if-no-files-found: error

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-smoke-${{ github.run_attempt }}
          path: .aiflow/fuzz/
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 14

  codeql:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: true

      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: go
          queries: +security-extended,security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4

  scorecard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          publish_results: true

      - name: Upload OpenSSF Scorecard SARIF
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: scorecard-results.sarif

  database:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17.6@sha256:00bc86618629af00d2937fdc5a5d63db3ff8450acf52f0636ec813c7f4902929
        env:
          POSTGRES_USER: knifer
          POSTGRES_PASSWORD: fixture-only
          POSTGRES_DB: knifer
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U knifer -d knifer"
          --health-interval 2s --health-timeout 3s --health-retries 30
      mysql:
        image: mysql:8.4.6@sha256:869218921e61d6c3c89820955d63cca42971f0e3e6c1e2792247bbd944ebc6e9
        env:
          MYSQL_ROOT_PASSWORD: fixture-root-only
          MYSQL_USER: knifer
          MYSQL_PASSWORD: fixture-only
          MYSQL_DATABASE: knifer
        ports: ["3306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uknifer -pfixture-only"
          --health-interval 2s --health-timeout 3s --health-retries 60
    env:
      DB_TEST_ENGINES: sqlite,postgres,mysql
      KNIFER_TEST_POSTGRES_DSN: postgres://knifer:fixture-only@127.0.0.1:5432/knifer?sslmode=disable
      KNIFER_TEST_MYSQL_DSN: knifer:fixture-only@tcp(127.0.0.1:3306)/knifer?parseTime=true&loc=UTC&timeout=5s
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: true
          cache-dependency-path: |
            go.sum
            integration/db/go.sum
      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"
      - name: Build result recorder
        run: go build -o .aiflow/ci/ciresult ./bin/ciresult
      - name: Run database contracts
        run: .aiflow/ci/ciresult run -id database -out .aiflow/ci/records -- make db-integration-check
      - name: Upload command result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-result-${{ github.run_attempt }}-database
          path: .aiflow/ci/records/database.json
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload database test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: database-tests-${{ github.run_attempt }}
          path: .aiflow/db-integration/
          include-hidden-files: true
          if-no-files-found: warn

  admission:
    if: always()
    needs: [agent-governance, test, lint, govulncheck, benchmark-smoke, fuzz-smoke, codeql, scorecard, database]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    env:
      CI_NEEDS_JSON: ${{ toJSON(needs) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: true

      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"

      - name: Download command results
        uses: actions/download-artifact@v7
        with:
          pattern: ci-result-${{ github.run_attempt }}-*
          path: .aiflow/ci/results
          merge-multiple: true

      - name: Require current successful evidence
        run: make ci-admission-check

      - name: Upload admission report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: agent-validation-evidence-${{ github.run_attempt }}
          path: |
            .aiflow/ci/manifest.json
            .aiflow/ci/admission.json
          include-hidden-files: true
          if-no-files-found: warn
