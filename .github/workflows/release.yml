name: knifer-go-release

env:
  GOTOOLCHAIN: local
  GOLANGCI_LINT_VERSION: v2.14.0
  GO_RELEASE_VERSION: "1.27.1"

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: release
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_RELEASE_VERSION }}
          cache: true

      - name: Record fixed Go toolchain
        run: |
          go version
          go env GOTOOLCHAIN
          test "$(go env GOVERSION)" = "go${{ env.GO_RELEASE_VERSION }}"

      - name: Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@${{ env.GOLANGCI_LINT_VERSION }}

      - name: Verify tag matches module version format
        shell: bash
        run: |
          case "${GITHUB_REF_NAME}" in
            v[0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "release tag must look like vMAJOR.MINOR.PATCH: ${GITHUB_REF_NAME}" >&2; exit 1 ;;
          esac

      - name: Verify changelog contains release notes
        shell: bash
        run: make release-notes-check RELEASE_VERSION="${GITHUB_REF_NAME#v}"

      - name: Verify release gates
        run: make release-check COVERAGE_FILE=/tmp/knifer-go-release-coverage.out

      - name: Verify v1 governance maturity gates
        run: |
          make governance-maturity-check
          make bench-regression-check

      - name: Verify benchmark smoke gate
        run: make bench-smoke

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
